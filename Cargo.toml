[workspace]
resolver = "2"
members = ["crates/foxvpn", "crates/fox-desktop", "crates/fox-android"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["Fox-VPN"]
repository = "https://github.com/muerfox/Fox-VPN"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
bytes = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
ipnet = "2"
keyring = { version = "4", features = ["v1"] }
libc = "0.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
russh = "0.64"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
socket2 = "0.6"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
tun = { version = "0.8", features = ["async"] }
ipstack = "1.0"
zeroize = { version = "1", features = ["derive"] }
eframe = "0.37"
jni = "0.21"
